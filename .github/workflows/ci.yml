name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Placeholders only. The app is written to render an empty feed rather than 500 when
      # Supabase is unconfigured, so the build never needs real credentials — and CI must
      # never hold a key that can read donor data.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

  database:
    name: postgres functions (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Only the database is needed. Excluding the rest cuts several minutes off a job that
      # runs on every push.
      - name: Start Postgres with migrations applied
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor,realtime,storage-api

      # credit_donation idempotency and the request_payout reservation guard. These run
      # against the real migrations, so a migration that breaks a money function fails here
      # rather than in production.
      - name: Run pgTAP suite
        run: supabase test db
